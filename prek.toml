minimum_prek_version = "0.5.7"
default_install_hook_types = ["pre-commit"]
default_language_version = { python = "3.13" }

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=lf"]

[[repos.hooks]]
id = "fix-byte-order-marker"

[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=1024"]

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-illegal-windows-names"

[[repos.hooks]]
id = "check-merge-conflict"
args = ["--assume-in-merge"]

[[repos.hooks]]
id = "check-symlinks"

[[repos.hooks]]
id = "destroyed-symlinks"

[[repos.hooks]]
id = "check-executables-have-shebangs"

[[repos.hooks]]
id = "check-shebang-scripts-are-executable"

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "detect-private-key"

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"

[[repos.hooks]]
id = "gitleaks"

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.51.1"

[[repos.hooks]]
id = "typos"

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.3"

[[repos.hooks]]
id = "ruff-check"
args = ["--fix"]

[[repos.hooks]]
id = "ruff-format"

[[repos]]
repo = "local"

# ty reads requires-python from sync.py's PEP 723 block
[[repos.hooks]]
id = "ty"
name = "ty"
language = "system"
entry = "uvx ty@0.0.95 check --no-progress"
types = ["python"]

[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "0.39.0"

# schema allows unknown keys, so misspelt setting names still pass
[[repos.hooks]]
id = "check-jsonschema"
name = "check-jsonschema (Claude Code settings)"
files = '^config/settings\.json$'
args = ["--schemafile", "https://www.schemastore.org/claude-code-settings.json"]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.3.2"

[[repos.hooks]]
id = "rumdl-fmt"

[[repos.hooks]]
id = "rumdl-check"

[[repos]]
repo = "https://github.com/EbodShojaei/bake"
rev = "v1.4.6"

[[repos.hooks]]
id = "mbake-format"

[[repos.hooks]]
id = "mbake-validate"

[[repos]]
repo = "https://github.com/checkmake/checkmake"
rev = "v0.3.2"

[[repos.hooks]]
id = "checkmake"
